services:
  fritzbox-widget:
    build:
      context: .
      dockerfile: Dockerfile
    image: fritzbox-homarr-widget:latest
    container_name: fritzbox-homarr-widget
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - ROUTER_IP=${ROUTER_IP:-192.168.178.1}
      - ROUTER_PORT=${ROUTER_PORT:-49000}
      - ROUTER_PROTOCOL=${ROUTER_PROTOCOL:-http}
      - ROUTER_USERNAME=${ROUTER_USERNAME:-}
      - ROUTER_PASSWORD=${ROUTER_PASSWORD:-}
      - PORT=${PORT:-5050}
      - MOCK_MODE=${MOCK_MODE:-false}
